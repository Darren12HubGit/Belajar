    <line x1="0" y1="56" x2="420" y2="56" stroke="#cbd5e1" stroke-width="1.5"/>

    <text x="0" y="92" fill="#475569" font-family="'Inter', sans-serif" font-size="13">has successfully completed the 9-course professional program</text>
    <text x="0" y="125" fill="#0668E1" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Meta Front-End Developer Professional Certificate</text>
    <text x="0" y="152" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Mastering React, JavaScript ES6+, UI design systems, and responsive front-end engineering.</text>

