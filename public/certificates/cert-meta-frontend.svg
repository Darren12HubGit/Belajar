<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="#e2e8f0" stroke-width="2" rx="4"/>

  <!-- Meta Blue Infinity Logo -->
  <g transform="translate(60, 55)">
    <path d="M 28,14 C 20,4 10,4 4,14 C -2,24 2,34 10,34 C 18,34 24,24 32,14 C 40,4 46,4 54,4 C 62,4 66,14 60,24 C 54,34 44,34 36,24" fill="none" stroke="#0668E1" stroke-width="5" stroke-linecap="round"/>
