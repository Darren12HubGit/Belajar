      <text x="0" y="34" fill="#0f172a" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Meta Staff Engineering</text>
      <text x="0" y="46" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Coursera Verified Instructor</text>
