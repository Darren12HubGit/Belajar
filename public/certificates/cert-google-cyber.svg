    <text x="0" y="125" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Google Cybersecurity Professional Certificate</text>
    <text x="0" y="152" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Covers network security, SIEM systems, packet analysis, incident triage, and Python automation.</text>

