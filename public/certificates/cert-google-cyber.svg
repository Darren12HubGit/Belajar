    <text x="0" y="44" fill="#1e293b" font-family="'Georgia', serif" font-weight="bold" font-size="32">Darren Raisya Iqbal</text>
    <line x1="0" y1="56" x2="420" y2="56" stroke="#e2e8f0" stroke-width="1.5"/>

