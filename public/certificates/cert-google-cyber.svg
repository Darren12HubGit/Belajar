    <text x="0" y="-8" text-anchor="middle" fill="#1e293b" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">GOOGLE</text>
    <text x="0" y="8" text-anchor="middle" fill="#34A853" font-family="'Inter', sans-serif" font-size="9" font-weight="900">SECURITY</text>
