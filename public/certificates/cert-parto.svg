<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="760" height="520" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8"/>

  <!-- Right Decorative Leaf Pattern -->
  <path d="M 600,0 C 720,120 780,260 760,420 C 740,490 680,560 620,560 C 660,480 670,360 620,260 C 570,160 540,80 600,0 Z" fill="url(#leafGrad)" opacity="0.95"/>
  <path d="M 680,60 C 760,180 800,320 780,500 C 760,530 730,560 700,560 C 740,460 750,300 700,180 C 670,120 660,80 680,60 Z" fill="#16a34a" opacity="0.8"/>
  <path d="M 620,260 Q 690,280 760,250" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 630,340 Q 690,360 750,330" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 650,420 Q 700,430 740,400" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Left Header Logos -->
  <g transform="translate(50, 45)">
    <!-- AT logo -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#0284c7"/>
    <text x="7" y="20" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="16">AT</text>
    
    <!-- Parto.id -->
    <g transform="translate(38, 4)">
      <path d="M 0,10 L 10,0 L 20,10 L 10,20 Z" fill="#22c55e"/>
      <text x="26" y="16" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="800" font-size="18">Parto<tspan fill="#22c55e">.id</tspan></text>
    </g>
  </g>

  <!-- Title "Sertifikat" -->
  <text x="50" y="150" fill="#15803d" font-family="'Georgia', serif" font-weight="bold" font-size="44" letter-spacing="1">Sertifikat</text>
  <rect x="50" y="165" width="240" height="3" fill="#ca8a04"/>

  <!-- Subtitle -->
  <text x="50" y="195" fill="#64748b" font-family="'Inter', sans-serif" font-size="13" font-weight="500">DIBERIKAN KEPADA</text>

  <!-- Recipient Name -->
  <text x="50" y="240" fill="#0f172a" font-family="'Georgia', serif" font-weight="bold" font-size="30">Darren Raisya Iqbal</text>
  <line x1="50" y1="252" x2="420" y2="252" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Description paragraph -->
  <text x="50" y="285" fill="#334155" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Atas dedikasi dan kontribusinya dalam menyelesaikan program magang</text>
  <text x="50" y="306" fill="#0f172a" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Backend Developer Internship - Parto.id</text>
  <text x="50" y="327" fill="#334155" font-family="'Inter', sans-serif" font-size="13">pada divisi Engineering PT. Affan Technology Indonesia secara memuaskan.</text>

  <!-- Credential Number & Date -->
  <g transform="translate(50, 375)">
    <text x="0" y="0" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="bold">NO: 196/EKS/HCLGA/ATI/VIII/2025</text>
    <text x="0" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Diterbitkan pada: 25 Juli 2025</text>
  </g>

  <!-- Signatures & Partner Logos Footer -->
  <g transform="translate(50, 460)">
    <!-- Signature line 1 -->
    <path d="M 0,15 Q 30,-5 60,15 T 120,10" stroke="#0f172a" stroke-width="2" fill="none"/>
    <line x1="0" y1="25" x2="150" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="38" fill="#0f172a" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Affan Satria, S.Kom</text>
    <text x="0" y="50" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Chief Technology Officer</text>

    <!-- Partner logos icons on bottom -->
    <g transform="translate(240, 25)">
      <circle cx="10" cy="5" r="10" fill="#ef4444" opacity="0.8"/>
      <circle cx="40" cy="5" r="10" fill="#3b82f6" opacity="0.8"/>
      <circle cx="70" cy="5" r="10" fill="#f59e0b" opacity="0.8"/>
      <text x="95" y="10" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Certified Partner</text>
    </g>
  </g>
</svg>
