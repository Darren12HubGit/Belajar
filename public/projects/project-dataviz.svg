<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="dv-chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="dv-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#dv-bg)"/>

  <!-- Top bar -->
  <rect width="800" height="42" fill="#0f172a"/>
  <line x1="0" y1="42" x2="800" y2="42" stroke="#1e293b" stroke-width="1"/>
  <circle cx="20" cy="21" r="5" fill="#ef4444"/>
  <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="21" r="5" fill="#10b981"/>

  <text x="80" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">DataViz Cloud Intelligence</text>
  <rect x="250" y="11" width="140" height="20" rx="4" fill="#1e293b"/>
  <text x="260" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">📅 Last 30 Days ▼</text>
  <rect x="700" y="10" width="75" height="22" rx="6" fill="#2563eb"/>
  <text x="737" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Export CSV</text>

  <!-- 3 Metric Cards Row -->
  <g transform="translate(30, 56)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="232" height="76" rx="8" fill="#151e2e" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Total Revenue</text>
    <text x="16" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">$84,320.50</text>
    <rect x="156" y="14" width="60" height="18" rx="9" fill="#065f46"/>
    <text x="186" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">+18.4% ↑</text>

    <!-- Metric 2 -->
    <rect x="254" y="0" width="232" height="76" rx="8" fill="#151e2e" stroke="#1e293b" stroke-width="1"/>
    <text x="270" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Active API Consumers</text>
    <text x="270" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">14,290</text>
    <rect x="410" y="14" width="60" height="18" rx="9" fill="#065f46"/>
    <text x="440" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">+9.2% ↑</text>

    <!-- Metric 3 -->
    <rect x="508" y="0" width="232" height="76" rx="8" fill="#151e2e" stroke="#1e293b" stroke-width="1"/>
    <text x="524" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">System Latency (P99)</text>
    <text x="524" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">24.6 ms</text>
    <rect x="664" y="14" width="60" height="18" rx="9" fill="#1e293b"/>
    <text x="694" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Optimal</text>
  </g>

  <!-- Main Chart Section: Left (Area Chart) -->
  <g transform="translate(30, 148)">
    <rect width="486" height="305" rx="10" fill="#151e2e" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">Query Ingestion &amp; Traffic Volume</text>
    <text x="20" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Real-time throughput streams per second</text>

    <!-- Grid lines -->
    <line x1="20" y1="80" x2="466" y2="80" stroke="#1e293b" stroke-width="1"/>
    <line x1="20" y1="130" x2="466" y2="130" stroke="#1e293b" stroke-width="1"/>
    <line x1="20" y1="180" x2="466" y2="180" stroke="#1e293b" stroke-width="1"/>
    <line x1="20" y1="230" x2="466" y2="230" stroke="#1e293b" stroke-width="1"/>

    <!-- Axis Labels -->
    <text x="466" y="84" fill="#64748b" font-size="9" text-anchor="end">100k</text>
    <text x="466" y="134" fill="#64748b" font-size="9" text-anchor="end">50k</text>
    <text x="466" y="184" fill="#64748b" font-size="9" text-anchor="end">25k</text>
    <text x="466" y="234" fill="#64748b" font-size="9" text-anchor="end">0</text>

    <!-- Area chart polygon and line -->
    <polygon points="30,230 70,180 120,195 170,130 220,140 270,95 320,110 370,75 420,90 450,60 450,230" fill="url(#dv-chart-fill)"/>
    <polyline points="30,230 70,180 120,195 170,130 220,140 270,95 320,110 370,75 420,90 450,60" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="370" cy="75" r="4.5" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <circle cx="450" cy="60" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

    <!-- X-Axis timeline -->
    <text x="40" y="255" fill="#64748b" font-size="9">Day 1</text>
    <text x="140" y="255" fill="#64748b" font-size="9">Day 8</text>
    <text x="240" y="255" fill="#64748b" font-size="9">Day 15</text>
    <text x="340" y="255" fill="#64748b" font-size="9">Day 22</text>
    <text x="440" y="255" fill="#64748b" font-size="9">Day 30</text>
  </g>

  <!-- Right Section: Donut Breakdown + Channel Metrics -->
  <g transform="translate(534, 148)">
    <rect width="236" height="305" rx="10" fill="#151e2e" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13">API Distribution</text>
    <text x="18" y="44" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Protocols &amp; formats</text>

    <!-- Mini Donut -->
    <circle cx="118" cy="115" r="44" fill="none" stroke="#1e293b" stroke-width="16"/>
    <circle cx="118" cy="115" r="44" fill="none" stroke="#3b82f6" stroke-width="16" stroke-dasharray="140 280" transform="rotate(-90 118 115)"/>
    <circle cx="118" cy="115" r="44" fill="none" stroke="#10b981" stroke-width="16" stroke-dasharray="75 280" stroke-dashoffset="-140" transform="rotate(-90 118 115)"/>
    <circle cx="118" cy="115" r="44" fill="none" stroke="#f59e0b" stroke-width="16" stroke-dasharray="45 280" stroke-dashoffset="-215" transform="rotate(-90 118 115)"/>
    <text x="118" y="119" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" text-anchor="middle">100%</text>

    <!-- Legend breakdown list -->
    <g transform="translate(20, 185)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="18" y="10" fill="#cbd5e1" font-size="10">REST API v2 (55%)</text>

      <circle cx="6" cy="30" r="4" fill="#10b981"/>
      <text x="18" y="34" fill="#cbd5e1" font-size="10">GraphQL Endpoints (28%)</text>

      <circle cx="6" cy="54" r="4" fill="#f59e0b"/>
      <text x="18" y="58" fill="#cbd5e1" font-size="10">Webhooks / Sockets (17%)</text>
    </g>

    <rect x="20" y="260" width="196" height="28" rx="6" fill="#1e293b"/>
    <text x="118" y="278" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">Live Health: ALL SYSTEMS NORMAL</text>
  </g>
</svg>
