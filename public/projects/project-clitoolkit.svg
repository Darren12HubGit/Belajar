<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cli-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
    <radialGradient id="cli-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="480" fill="url(#cli-bg)"/>
  <rect width="800" height="480" fill="url(#cli-glow)"/>

  <!-- Terminal Window Chrome Frame -->
  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <rect width="720" height="38" rx="12" fill="#18181b"/>
    <rect x="0" y="24" width="720" height="14" fill="#18181b"/>
    <line x1="0" y1="38" x2="720" y2="38" stroke="#27272a" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>

    <text x="360" y="24" fill="#71717a" font-family="monospace" font-size="11" text-anchor="middle">darren@darwin: ~/projects/cli-toolkit (zsh)</text>

    <!-- Terminal Content Area -->
    <g transform="translate(24, 60)" font-family="monospace">
      <!-- Command prompt line -->
      <text x="0" y="16" font-size="12">
        <tspan fill="#10b981">➜</tspan>
        <tspan fill="#38bdf8"> workspace</tspan>
        <tspan fill="#a1a1aa"> git:(</tspan><tspan fill="#f43f5e">main</tspan><tspan fill="#a1a1aa">)</tspan>
        <tspan fill="#ffffff"> npx cli-toolkit@latest init my-production-stack</tspan>
      </text>

      <!-- ASCII Logo Banner -->
      <g transform="translate(0, 36)" fill="#10b981" font-size="10">
        <text x="0" y="14">   ____ _     ___   _____           _ _    _ _   </text>
        <text x="0" y="26">  / ___| |   |_ _| |_   _|__   ___ | | | _(_) |_ </text>
        <text x="0" y="38"> | |   | |    | |    | |/ _ \ / _ \| | |/ / | __|</text>
        <text x="0" y="50"> | |___| |___ | |    | | (_) | (_) | |   &lt;| | |_ </text>
        <text x="0" y="62">  \____|_____|___|   |_|\___/ \___/|_|_|\_\_|\__| v2.4.0</text>
      </g>

      <!-- Execution Logs with Steps -->
      <g transform="translate(0, 120)" font-size="12">
        <text x="0" y="14" fill="#71717a">⚡ Starting ultra-fast developer workspace generator...</text>

        <text x="0" y="40">
          <tspan fill="#10b981">✔</tspan>
          <tspan fill="#e4e4e7"> Parsing project configurations and dependencies</tspan>
          <tspan fill="#71717a"> (18ms)</tspan>
        </text>

        <text x="0" y="66">
          <tspan fill="#10b981">✔</tspan>
          <tspan fill="#e4e4e7"> Generating TypeScript strict template scaffold</tspan>
          <tspan fill="#71717a"> (42ms)</tspan>
        </text>

        <text x="0" y="92">
          <tspan fill="#10b981">✔</tspan>
          <tspan fill="#e4e4e7"> Configuring ESLint, Prettier &amp; Husky pre-commit hooks</tspan>
          <tspan fill="#71717a"> (65ms)</tspan>
        </text>

        <text x="0" y="118">
          <tspan fill="#10b981">✔</tspan>
          <tspan fill="#e4e4e7"> Optimizing Docker multi-stage build scripts</tspan>
          <tspan fill="#71717a"> (88ms)</tspan>
        </text>

        <text x="0" y="144">
          <tspan fill="#3b82f6">ℹ</tspan>
          <tspan fill="#93c5fd"> Creating automated CI/CD GitHub Actions workflow</tspan>
          <tspan fill="#71717a"> (12ms)</tspan>
        </text>

        <!-- Success Output Box -->
        <rect x="0" y="165" width="670" height="54" rx="8" fill="#14532d" fill-opacity="0.25" stroke="#16a34a" stroke-opacity="0.4"/>
        <text x="16" y="188" fill="#4ade80" font-weight="700">🎉 SUCCESS: Project environment built in 225ms!</text>
        <text x="16" y="206" fill="#86efac" font-size="11">Next: cd ./my-production-stack &amp;&amp; npm run dev</text>

        <!-- Prompt cursor ready for next command -->
        <text x="0" y="246">
          <tspan fill="#10b981">➜</tspan>
          <tspan fill="#38bdf8"> my-production-stack</tspan>
          <tspan fill="#a1a1aa"> git:(</tspan><tspan fill="#f43f5e">main</tspan><tspan fill="#a1a1aa">)</tspan>
          <tspan fill="#ffffff"> </tspan>
          <tspan fill="#10b981">█</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
