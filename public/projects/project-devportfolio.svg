<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="dp-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="dp-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1f2c"/>
      <stop offset="100%" stop-color="#131722"/>
    </linearGradient>
    <radialGradient id="dp-glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#dp-bg)"/>
  <rect width="800" height="480" fill="url(#dp-glow)"/>

  <!-- Browser window chrome -->
  <rect width="800" height="38" fill="#11141b"/>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#222734" stroke-width="1"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <rect x="240" y="9" width="320" height="20" rx="6" fill="#191e2b" stroke="#262d3d" stroke-width="1"/>
  <text x="400" y="23" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">portfolio.darrenraisya.dev</text>

  <!-- Mini Sidebar (Left) -->
  <rect x="0" y="38" width="160" height="442" fill="#0f1218"/>
  <line x1="160" y1="38" x2="160" y2="480" stroke="#1f2430" stroke-width="1"/>

  <!-- Avatar & Profile info in Sidebar -->
  <circle cx="45" cy="80" r="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="45" y="85" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" text-anchor="middle">DR</text>
  <text x="72" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12">Darren</text>
  <text x="72" y="92" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Software Eng.</text>

  <!-- Sidebar Nav items -->
  <rect x="15" y="125" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
  <text x="35" y="143" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11">● Beranda</text>
  <text x="35" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">○ Tentang</text>
  <text x="35" y="207" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">○ Pencapaian</text>
  <text x="35" y="237" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">○ Proyek</text>
  <text x="35" y="267" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">○ Kontak</text>

  <!-- Main Content Canvas -->
  <g transform="translate(195, 70)">
    <!-- Hero Greeting -->
    <rect x="0" y="0" width="110" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="55" y="14" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" text-anchor="middle">ONLINE &amp; ACTIVE</text>

    <text x="0" y="48" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="24">Darren Raisya Iqbal</text>
    <text x="0" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Software Engineer &amp; Full-Stack Web Developer</text>

    <!-- Bio Preview Card -->
    <rect x="0" y="90" width="560" height="70" rx="10" fill="url(#dp-card)" stroke="#232938" stroke-width="1"/>
    <text x="18" y="116" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Membangun arsitektur perangkat lunak yang bersih, skalabel, serta pengalaman</text>
    <text x="18" y="134" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">pengguna yang optimal menggunakan ekosistem modern React dan TypeScript.</text>

    <!-- Tech Badges -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#222a38" stroke="#334155" stroke-width="1"/>
      <text x="40" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">React 19</text>

      <rect x="90" y="0" width="75" height="24" rx="12" fill="#222a38" stroke="#334155" stroke-width="1"/>
      <text x="127" y="16" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vite 6</text>

      <rect x="175" y="0" width="105" height="24" rx="12" fill="#222a38" stroke="#334155" stroke-width="1"/>
      <text x="227" y="16" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tailwind CSS</text>

      <rect x="290" y="0" width="100" height="24" rx="12" fill="#222a38" stroke="#334155" stroke-width="1"/>
      <text x="340" y="16" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Parallax FX</text>
    </g>

    <!-- Code Preview Widget -->
    <rect x="0" y="225" width="560" height="150" rx="10" fill="#090b10" stroke="#1e2330" stroke-width="1"/>
    <rect x="0" y="225" width="560" height="26" rx="10" fill="#121620"/>
    <circle cx="16" cy="238" r="3.5" fill="#475569"/>
    <circle cx="28" cy="238" r="3.5" fill="#475569"/>
    <circle cx="40" cy="238" r="3.5" fill="#475569"/>
    <text x="60" y="242" fill="#64748b" font-family="monospace" font-size="10">App.jsx — React Router SPA</text>

    <text x="20" y="278" fill="#c084fc" font-family="monospace" font-size="11">export default function <tspan fill="#38bdf8">PortfolioApp</tspan>() {</text>
    <text x="36" y="298" fill="#94a3b8" font-family="monospace" font-size="11">const [theme, lang] = <tspan fill="#fbbf24">useAppContext</tspan>();</text>
    <text x="36" y="318" fill="#10b981" font-family="monospace" font-size="11">&lt;<tspan fill="#f43f5e">ParallaxContainer</tspan> activeRoute={pathname}&gt;</text>
    <text x="52" y="338" fill="#e2e8f0" font-family="monospace" font-size="11">&lt;<tspan fill="#f43f5e">ShowcaseGrid</tspan> animated={true} /&gt;</text>
    <text x="36" y="358" fill="#10b981" font-family="monospace" font-size="11">&lt;/<tspan fill="#f43f5e">ParallaxContainer</tspan>&gt;</text>
  </g>
</svg>
