  <text x="195" y="65" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="10" letter-spacing="0.05em">3 NOTES</text>

  <!-- Active Note -->
  <rect x="190" y="78" width="200" height="74" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="202" y="98" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12">Distributed Auth Engine</text>
  <text x="202" y="116" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">JWT token refresh cycle with...</text>
  <text x="202" y="136" fill="#58a6ff" font-size="9">Updated 2h ago • 1.4 KB</text>

  <!-- Other Note 1 -->
  <rect x="190" y="160" width="200" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
  <text x="202" y="180" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11">Zero-Trust Network Mesh</text>
  <text x="202" y="196" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">TLS mutual authentication...</text>

  <!-- Other Note 2 -->
  <rect x="190" y="236" width="200" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
  <text x="202" y="256" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11">Redis Cache Eviction</text>
  <text x="202" y="272" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">LRU strategy for session data...</text>

  <!-- Right Pane (Markdown Editor + Preview) -->
  <g transform="translate(420, 60)">
    <text x="0" y="20" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20">Distributed Auth Engine</text>
    <rect x="0" y="32" width="70" height="18" rx="4" fill="#238636" fill-opacity="0.2"/>
    <text x="35" y="44" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">#production</text>
    <rect x="78" y="32" width="60" height="18" rx="4" fill="#1f6feb" fill-opacity="0.2"/>
    <text x="108" y="44" fill="#58a6ff" font-size="9" font-weight="700" text-anchor="middle">v2.1 SPEC</text>

    <!-- Markdown text & code -->
    <text x="0" y="76" fill="#8b949e" font-family="monospace" font-size="11">## System Overview</text>
    <text x="0" y="98" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">This module coordinates stateless session issuance and cryptographic</text>
    <text x="0" y="116" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">token verification across all edge worker clusters.</text>

    <text x="0" y="148" fill="#8b949e" font-family="monospace" font-size="11">### Implementation Logic</text>

    <!-- Code box -->
    <rect x="0" y="162" width="350" height="90" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="16" y="186" fill="#ff7b72" font-family="monospace" font-size="11">const <tspan fill="#79c0ff">authSession</tspan> = <tspan fill="#d2a8ff">await</tspan> vault.<tspan fill="#79c0ff">verifyToken</tspan>({</text>
    <text x="32" y="206" fill="#e6edf3" font-family="monospace" font-size="11">payload: req.headers.authorization,</text>
    <text x="32" y="226" fill="#7ee787" font-family="monospace" font-size="11">algorithms: ['RS256', 'Ed25519']</text>
    <text x="16" y="244" fill="#ff7b72" font-family="monospace" font-size="11">});</text>

    <!-- Checklist -->
    <g transform="translate(0, 270)">
      <rect x="0" y="4" width="12" height="12" rx="3" fill="#238636"/>
      <text x="4" y="13" fill="#ffffff" font-size="9" font-weight="700">✓</text>
      <text x="22" y="14" fill="#c9d1d9" font-size="11">Encrypted Local Storage Cache via IndexedDB</text>

      <rect x="0" y="26" width="12" height="12" rx="3" fill="#238636"/>
      <text x="4" y="35" fill="#ffffff" font-size="9" font-weight="700">✓</text>
      <text x="22" y="36" fill="#c9d1d9" font-size="11">Offline conflict-free replication (CRDT sync)</text>

      <rect x="0" y="48" width="12" height="12" rx="3" fill="#238636"/>
      <text x="4" y="57" fill="#ffffff" font-size="9" font-weight="700">✓</text>
      <text x="22" y="58" fill="#c9d1d9" font-size="11">Markdown live syntax highlighter &amp; KaTeX math</text>
